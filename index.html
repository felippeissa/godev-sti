/* ───────── Informatiza Design System · Tokens ─────────
   Source: uploads/InformatizaDesignSystem.md                */

:root {
  /* Primary (verde institucional) */
  --primary-900: #0D2B1F;
  --primary-700: #1B5E36;
  --primary-500: #39B65E;
  --primary-300: #A1E8B8;

  /* Neutrals */
  --neutral-900: #111827;
  --neutral-700: #374151;
  --neutral-500: #6B7280;
  --neutral-300: #D1D5DB;
  --neutral-100: #F3F4F6;
  --white: #FFFFFF;

  /* Surfaces — light theme */
  --bg: var(--white);
  --bg-alt: var(--neutral-100);
  --surface: var(--white);
  --surface-2: var(--neutral-100);
  --surface-3: #E5E7EB;
  --text: var(--neutral-900);
  --text-2: var(--neutral-500);
  --text-3: #9CA3AF;
  --border: #E5E7EB;
  --border-strong: var(--neutral-300);

  /* Brand */
  --accent: var(--primary-500);
  --accent-hover: var(--primary-700);
  --accent-soft: #E6F7EC;
  --accent-text: var(--primary-700);
  --accent-deep: var(--primary-900);

  /* Spacing scale */
  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-2xl: 48px;

  /* Radii */
  --r-sm: 6px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
  --r-full: 999px;

  /* Type */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(17,24,39,.04), 0 1px 1px rgba(17,24,39,.03);
  --shadow-md: 0 4px 16px -2px rgba(17,24,39,.08), 0 2px 6px -1px rgba(17,24,39,.04);
  --shadow-lg: 0 24px 60px -12px rgba(13,43,31,.18), 0 8px 24px -6px rgba(13,43,31,.08);
  --shadow-glow: 0 0 0 0 rgba(57,182,94,.45);

  /* Code editor */
  --code-bg: #0B1F14;
  --code-text: #E6F0E8;
  --code-keyword: #7CCB91;
  --code-string: #FBCFE8;
  --code-comment: #5C7A66;
  --code-fn: #A1E8B8;
  --code-decorator: #FBBF24;
  --code-class: #BAE6FD;
}

:root[data-theme="dark"] {
  --bg: #0A1410;
  --bg-alt: #0F1D17;
  --surface: #122019;
  --surface-2: #182C22;
  --surface-3: #1F3A2C;
  --text: #F3F4F6;
  --text-2: #9AA7A0;
  --text-3: #6B7B72;
  --border: #1F3A2C;
  --border-strong: #2B4F3C;
  --accent: var(--primary-500);
  --accent-hover: var(--primary-300);
  --accent-soft: #14291D;
  --accent-text: var(--primary-300);
  --accent-deep: #052213;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 4px 16px -2px rgba(0,0,0,.45), 0 2px 6px -1px rgba(0,0,0,.3);
  --shadow-lg: 0 24px 60px -12px rgba(0,0,0,.6), 0 8px 24px -6px rgba(0,0,0,.4);
  --code-bg: #050D08;
}

/* ───────── Base ───────── */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 16px;
  line-height: 1.55;
  transition: background-color .35s ease, color .35s ease;
}
.mono { font-family: var(--font-mono); }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }

/* ───────── Layout helpers ───────── */
.container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 var(--sp-xl); }
@media (max-width: 720px) { .container { padding: 0 var(--sp-lg); } }

/* ───────── Typography scale ───────── */
h1, h2, h3, h4 { margin: 0; color: var(--text); letter-spacing: -.025em; }
h1 { font-size: clamp(40px, 5.6vw, 64px); font-weight: 700; line-height: 1.05; }
h2 { font-size: clamp(32px, 4vw, 48px); font-weight: 700; line-height: 1.1; }
h3 { font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -.015em; }
h4 { font-size: 16px; font-weight: 600; }
p  { margin: 0; color: var(--text-2); line-height: 1.6; }
.caption { font-size: 14px; color: var(--text-2); }

.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent-text);
}
.eyebrow::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft);
}

/* ───────── Buttons (48px height, full radius) ───────── */
.btn {
  display: inline-flex; align-items: center; gap: var(--sp-sm);
  height: 48px; padding: 0 24px;
  border-radius: var(--r-full);
  font-size: 15px; font-weight: 600; letter-spacing: -.005em;
  border: 1px solid transparent; cursor: pointer;
  transition: transform .18s ease, background-color .18s ease, border-color .18s ease, box-shadow .25s ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent); color: var(--white);
  box-shadow: 0 6px 18px -6px rgba(57,182,94,.4);
}
.btn-primary:hover {
  background: var(--primary-700);
  transform: translateY(-2px);
  box-shadow: 0 0 0 8px rgba(57,182,94,.12), 0 6px 18px -4px rgba(57,182,94,.5);
}
.btn-secondary {
  background: transparent; color: var(--text);
  border: 1px solid var(--border-strong);
}
.btn-secondary:hover { background: var(--surface-2); border-color: var(--accent); transform: translateY(-2px); }
.btn-ghost { background: transparent; color: var(--text-2); padding: 0 12px; }
.btn-ghost:hover { color: var(--text); }
.btn-dark { background: var(--primary-900); color: var(--white); }
.btn-dark:hover { background: var(--accent); transform: translateY(-2px); }

/* ───────── Pills / Badges ───────── */
.pill {
  display: inline-flex; align-items: center; gap: var(--sp-sm);
  padding: 6px 14px; border-radius: var(--r-full);
  font-size: 13px; font-weight: 500;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--border);
}
.pill .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }
.pill.online .dot { background: var(--accent); animation: pulse 2s infinite; }
.pill.online { color: var(--accent-text); background: var(--accent-soft); border-color: color-mix(in oklab, var(--accent) 20%, transparent); }
.pill.dark { background: var(--neutral-900); color: var(--white); border-color: transparent; }

/* ───────── Cards ───────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-xl);
  transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card-dark {
  background: var(--primary-900); color: var(--white); border-color: transparent;
}
.card-dark p { color: rgba(255,255,255,.7); }
.card-interactive { cursor: pointer; }
.card-interactive:hover { border-color: var(--accent); }

/* ───────── Section rhythm ───────── */
section { padding: var(--sp-2xl) 0; }
section.lg { padding: 96px 0 96px; }
section.xl { padding: 120px 0; }
@media (max-width: 720px) { section, section.lg, section.xl { padding: 64px 0; } }

/* ───────── Scroll reveal ───────── */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity .9s ease, transform .9s ease; }
.reveal.in { opacity: 1; transform: none; }

/* ───────── Animations ───────── */
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(57,182,94,.55); }
  70% { box-shadow: 0 0 0 8px rgba(57,182,94,0); }
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(57,182,94,.0), 0 6px 18px -6px rgba(57,182,94,.4); }
  50% { box-shadow: 0 0 0 10px rgba(57,182,94,.15), 0 6px 18px -6px rgba(57,182,94,.4); }
}

/* ───────── Grid utility ───────── */
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-lg); }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-2xl); }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-lg); }
@media (max-width: 920px) {
  .grid-3 { grid-template-columns: repeat(2, 1fr) !important; }
  .grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
  .grid-2 { grid-template-columns: 1fr !important; gap: var(--sp-xl); }
}
@media (max-width: 560px) {
  .grid-3, .grid-4 { grid-template-columns: 1fr !important; }
}

/* ───────── Logo slot ───────── */
.logo-slot { display: inline-flex; align-items: center; gap: 10px; }
.logo-slot .brand-logo { display: block; }
.logo-slot.dark-logo .brand-logo { filter: brightness(0) invert(1); }

/* ───────── Accessibility ───────── */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Hide scrollbar but allow scroll */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { scrollbar-width: none; }

/* Grid background utility */
.divider-grid {
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 56px 56px;
}
.noise::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .04;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ── FeatureStrip inside hero (no margin-top override) ── */
.feature-strip-hero { margin-top: 0 !important; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel">
/* shared/common.jsx — Nav, Footer, scroll reveal, theme + accent tweaks
   Globals exported: useReveal, ThemeToggle, Reveal, SiteNav, SiteFooter,
                     ScrollPill, AccentDot, applyAccent, ICONS                          */

const { useEffect, useRef, useState, useCallback } = React;

/* ───────── Scroll reveal observer ───────── */
function useReveal() {
  useEffect(() => {
    const observed = new WeakSet();
    const attach = () => {
      const els = document.querySelectorAll(".reveal:not(.in)");
      els.forEach(el => { if (!observed.has(el)) { observed.add(el); io.observe(el); } });
    };
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.08, rootMargin: "0px 0px -5% 0px" });
    attach();
    // Re-scan after a tick for late-mounted nodes
    const t1 = setTimeout(attach, 80);
    const t2 = setTimeout(attach, 400);
    return () => { clearTimeout(t1); clearTimeout(t2); io.disconnect(); };
  }, []);
}
function Reveal({ children, delay=0, as:Tag="div", ...rest }) {
  return <Tag className={(rest.className||"") + " reveal"} style={{ transitionDelay: delay+"ms", ...(rest.style||{}) }} {...rest}>{children}</Tag>;
}

/* ───────── Accent application ───────── */
function applyAccent(hex) {
  const root = document.documentElement;
  root.style.setProperty("--accent", hex);
  // derive hover/soft/text from hex (basic darken/lighten)
  const { r,g,b } = hexToRgb(hex);
  const hover = rgbToHex(r*0.82, g*0.82, b*0.92);
  const soft  = rgbToHex(r + (255-r)*0.88, g + (255-g)*0.88, b + (255-b)*0.88);
  const text  = rgbToHex(r*0.55, g*0.5, b*0.85);
  root.style.setProperty("--accent-hover", hover);
  root.style.setProperty("--accent-soft", soft);
  root.style.setProperty("--accent-text", text);
}
function hexToRgb(h) {
  h = h.replace("#",""); if (h.length===3) h = h.split("").map(c=>c+c).join("");
  return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
}
function rgbToHex(r,g,b){const c=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0");return "#"+c(r)+c(g)+c(b);}

function applyTheme(dark) {
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}

/* ───────── Theme toggle button ───────── */
function ThemeToggle({ dark, onToggle }) {
  return (
    <button
      onClick={onToggle}
      aria-label="Alternar tema"
      style={{
        width: 36, height: 36, borderRadius: 999,
        background: "var(--surface)",
        border: "1px solid var(--border)",
        color: "var(--text)",
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        cursor: "pointer", transition: "all .2s ease",
      }}
      onMouseOver={e => e.currentTarget.style.background = "var(--surface-2)"}
      onMouseOut={e => e.currentTarget.style.background = "var(--surface)"}
    >
      {dark ? (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      ) : (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
        </svg>
      )}
    </button>
  );
}

/* ───────── Site Navigation ───────── */
function SiteNav({ brand, navItems, ctaLabel="Acessar plataforma", dark, onToggleTheme, ctaHref="#cta" }) {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 24);
    fn(); window.addEventListener("scroll", fn, { passive: true });
    return () => window.removeEventListener("scroll", fn);
  }, []);
  return (
    <header style={{
      position: "fixed", top: 0, left: 0, right: 0, zIndex: 1000,
      backdropFilter: "blur(14px) saturate(160%)",
      WebkitBackdropFilter: "blur(14px) saturate(160%)",
      background: "rgba(11,30,20,0.92)",
      borderBottom: "1px solid rgba(255,255,255,0.07)",
      transition: "all .25s ease",
    }}>
      <div className="container" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 32px", maxWidth: 1280 }}>
        <a href="#" className={"logo-slot " + (dark ? "dark-logo" : "")} data-logo-slot={brand.key}>
          {brand.logo
            ? <img src={brand.logo} alt={brand.wordmark} style={{ height: brand.logoHeight || 32, width: "auto", display: "block" }} className="brand-logo"/>
            : <span style={{ fontWeight: 700, fontSize: 18, color: "var(--text)" }}>{brand.wordmark}</span>}
        </a>
        <nav className="nav-desktop" style={{ display: "flex", gap: 28, alignItems: "center" }}>
          {navItems.map(item => (
            <a key={item} href={`#${slug(item)}`} style={{
              fontSize: 13.5, color: "rgba(255,255,255,0.65)", fontWeight: 450, letterSpacing: "-.005em",
              transition: "color .15s",
            }}
            onMouseOver={e => e.currentTarget.style.color = "#ffffff"}
            onMouseOut={e => e.currentTarget.style.color = "rgba(255,255,255,0.65)"}>{item}</a>
          ))}
        </nav>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <ThemeToggle dark={dark} onToggle={onToggleTheme} />
          <a href={ctaHref} className="btn btn-primary nav-cta" style={{ height: 40, fontSize: 14 }}>{ctaLabel} <span aria-hidden>→</span></a>
          <button className="nav-hamburger" aria-label="Menu"
            onClick={() => setOpen(o => !o)}
            style={{
              display: "none", background: "transparent", border: "1px solid var(--border)",
              width: 36, height: 36, borderRadius: 999, padding: 0, cursor: "pointer"
            }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={open ? "M6 6l12 12M6 18L18 6" : "M3 6h18M3 12h18M3 18h18"}/></svg>
          </button>
        </div>
      </div>
      {open && (
        <div className="nav-mobile-panel" style={{
          background: "var(--surface)", borderTop: "1px solid var(--border)", padding: "16px 24px"
        }}>
          {navItems.map(it => (
            <a key={it} href={`#${slug(it)}`} onClick={() => setOpen(false)}
              style={{ display: "block", padding: "10px 0", color: "var(--text)" }}>{it}</a>
          ))}
        </div>
      )}
      <style>{`
        @media (max-width: 920px) {
          .nav-desktop { display: none !important; }
          .nav-cta { display: none !important; }
          .nav-hamburger { display: inline-flex !important; align-items: center; justify-content: center; color: var(--text); }
        }
      `}</style>
    </header>
  );
}

function slug(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}

/* ───────── Footer ───────── */
function SiteFooter({ brand, tagline, blurb, columns, version, motto }) {
  return (
    <footer style={{ background: "var(--primary-900)", color: "#fff", padding: "80px 0 32px", position: "relative", overflow: "hidden" }}>
      <div className="container" style={{ position: "relative" }}>
        <div style={{ fontSize: "clamp(28px,3.5vw,44px)", lineHeight: 1.15, maxWidth: 880, marginBottom: 56, fontWeight: 600, letterSpacing: "-.02em", color: "#fff" }}>
          {motto}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr 1fr 1fr", gap: 48, marginBottom: 56 }} className="footer-grid">
          <div>
            <div className="logo-slot dark-logo" data-logo-slot={brand.key} style={{ marginBottom: 16 }}>
              {brand.logo
                ? <img src={brand.logo} alt={brand.wordmark} style={{ height: (brand.logoHeight || 32) + 4, width: "auto", display: "block" }} className="brand-logo"/>

function SourceBox({ title, subs, accent }) {

function SmallBox({ title, sub }) {
  return (

/* ───────── Pilares ───────── */
function PillarsGrid({ items }) {
  return (
    <div className="grid-3" style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 20 }}>
      {items.map((p, i) => (
        <Reveal delay={i*60} key={p.title} className="card reveal" style={{ minHeight: 220, display: "flex", flexDirection: "column", gap: 12 }}>

          <button key={tab.label} onClick={() => setIdx(i)} style={{

            color: i === idx ? "var(--bg)" : "var(--text-2)",

          <p style={{ marginTop: 16, fontSize: 15.5, maxWidth: 460 }}>{t.body}</p>

                <span style={{
                  flexShrink: 0, marginTop: 4,
                  width: 16, height: 16, borderRadius: 999,
                  background: "var(--accent-soft)", color: "var(--accent-text)",
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                }}>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M5 12l5 5L20 7"/></svg>
                </span>
                <span style={{ color: "var(--text)" }}>{b}</span>
              </li>
            ))}
          </ul>
        </div>
        <div style={{
          background: "var(--surface-2)", borderRadius: 16, padding: 32,
          display: "flex", flexDirection: "column", justifyContent: "space-between",
          border: "1px solid var(--border)",

        @media (max-width: 920px){
          .persona-card{grid-template-columns:1fr !important; padding:28px !important; gap:24px !important}
          .persona-tabs{flex-wrap:wrap}
        }

    </div>
  );
}

/* ───────── Impactos ───────── */
function ImpactStats({ stats }) {
  return (
    <div className="grid-4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 0,

          padding: "40px 0", borderRight: i < stats.length-1 ? "1px solid var(--border)" : "none",

        }
      `}</style>
    </div>

}

/* ───────── CTA banner ───────── */
function CTABanner({ headline, italic, blurb, primary, secondary }) {

          <h2 style={{ color: "var(--bg)", fontSize: "clamp(40px, 5vw, 72px)" }}>

        </Reveal>
        <Reveal delay={80}>
          <p style={{ fontSize: 17, color: "rgba(255,255,255,0.62)", marginTop: 20, maxWidth: 640 }}>{blurb}</p>
        </Reveal>
        <Reveal delay={140} style={{ display: "flex", gap: 12, marginTop: 36, flexWrap: "wrap" }}>
          <a href="#" className="btn btn-primary" style={{}}>{primary} <span aria-hidden>→</span></a>

        </Reveal>
      </div>
    </div>
  );
}
